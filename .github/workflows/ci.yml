name: JARVIS Monorepo CI

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]

jobs:
  python-agent-ci:
    name: Python Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Agent Dependencies
        run: |
          cd apps/agent
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Code Linter
        run: |
          cd apps/agent
          python -m ruff check src tests

      - name: Run Pytest Test Suite
        run: |
          cd apps/agent
          python -m pytest -v

  frontend-ci:
    name: React Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          cd apps/desktop/frontend
          npm install

      - name: Run TypeScript Typecheck
        run: |
          cd apps/desktop/frontend
          npm run typecheck

      - name: Run ESLint Linter
        run: |
          cd apps/desktop/frontend
          npm run lint

      - name: Build React Frontend Production Bundle
        run: |
          cd apps/desktop/frontend
          npm run build

  tauri-rust-ci:
    name: Tauri Rust Shell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo Check Tauri App
        run: |
          cd apps/desktop/tauri
          cargo check
